name = browseModeCaretFix
summary = Browse Mode Caret Fix
description = "Restores the NVDA browse-mode caret to the activated link after pressing Alt+Left Arrow in Microsoft Edge. Supports conventional pages and single-page applications, and starts newly opened Reddit posts at the top."
author = "Josh Kennedy <joshknnd1982@gmail.com>"
version = 3.0.24
url = https://github.com/joshknnd1982/browseModeCaretFix
changelog = "Checks GitHub for updates. Once a day, a little after NVDA starts, the add-on asks github.com/joshknnd1982/browseModeCaretFix whether a newer version has been released, and says nothing unless there is one. When there is, a dialog shows what's new and offers to download and install it; the download must match the release's SHA-256 checksum, and NVDA asks you to confirm the installation. To check yourself, choose Tools, Check for add-on updates, Browse Mode Caret Fix in the NVDA menu, or press Check for updates now in the new Browse Mode Caret Fix settings panel, where the daily check can also be turned off. Going back to links in Edge works as before."
minimumNVDAVersion = 2019.3.0
lastTestedNVDAVersion = 2026.2.0
